name: Relay soak

# #403: a Windows and a macOS client, each Chromium running the web app, each paired with its own host on one macOS
# runner through the production relay, soaking at the same time: keystroke echo latency, output bursts, relay socket
# closes, reconnects, page errors, page visibility and frames drawn, and every 5 minutes a dropped link followed by a
# visit to Settings and back (the reporter's case). Run by hand (Actions > Relay soak > Run workflow), or push a soak/*
# branch to run it for 30 minutes on that branch's code; the table lands in the run summary.
#
# The runners meet only through this run's artifacts, which anyone can download on a public repository: each client
# publishes a public key, and the host answers with its single-use pairing link sealed to that key (apps/web/soak/seal.ts).
on:
  push:
    branches: ["soak/**"]
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes each client soaks (at most 60)
        default: "30"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: relay-soak-${{ github.ref }}
  cancel-in-progress: false

env:
  RELAY_URL: https://relay-doriface.omo.dev
  SOAK_MINUTES: ${{ inputs.minutes || '30' }}
  # Minutes between forced link drops with a Settings round-trip.
  SOAK_DROP_EVERY_MIN: "5"
  WEB_ORIGIN: http://127.0.0.1:4173

jobs:
  host:
    name: Host (macOS)
    runs-on: macos-15
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the soak length
        run: |
          if ! [[ "$SOAK_MINUTES" =~ ^[0-9]+$ ]] || [ "$SOAK_MINUTES" -lt 1 ] || [ "$SOAK_MINUTES" -gt 60 ]; then
            echo "::error::minutes must be 1 to 60, got '$SOAK_MINUTES'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.21/herdr-core-macos-aarch64.tar.gz
          HC_SHA256: 1ab38dd9270f63a8f794d6d60e8702eb0d1c85a72bda85d735e5eea43f05ffed
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      # One host per client, each with its own hc session: clients sharing one would type into each other's terminals.
      - name: Start a host per client on the production relay
        run: |
          port=7766
          for client in windows macos; do
            mkdir -p "$RUNNER_TEMP/host-$client"
            SHELL=/bin/bash nohup bun apps/host/src/cli.ts --hc "$HC_BIN" --relay "$RELAY_URL" --session "soak-$client" \
              --listen "127.0.0.1:$port" --state-dir "$RUNNER_TEMP/host-$client" > "$RUNNER_TEMP/host-$client.log" 2>&1 &
            port=$((port + 1))
          done
          for client in windows macos; do
            for _ in $(seq 1 60); do
              grep -q "relay: connected" "$RUNNER_TEMP/host-$client.log" && break
              sleep 1
            done
            cat "$RUNNER_TEMP/host-$client.log"
            grep -q "relay: connected" "$RUNNER_TEMP/host-$client.log"
          done
      - name: Pair the Windows client
        if: always()
        run: bash apps/web/soak/host-pair.sh windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-link-windows
          path: ${{ runner.temp }}/soak-link-windows.json
          retention-days: 1
      - name: Pair the macOS client
        if: always()
        run: bash apps/web/soak/host-pair.sh macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-link-macos
          path: ${{ runner.temp }}/soak-link-macos.json
          retention-days: 1
      - name: Keep the hosts up until every client is done
        if: always()
        run: |
          for client in windows macos; do
            bun apps/web/soak/artifact.ts "soak-done-$client" "$RUNNER_TEMP/done" 6000 &
          done
          wait
      - name: Host logs
        if: always()
        run: |
          for client in windows macos; do
            echo "== host for the $client client"
            cat "$RUNNER_TEMP/host-$client.log"
          done

  client:
    name: Client (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, runner: windows-latest, label: Windows x64 Chromium }
          - { name: macos, runner: macos-15, label: macOS arm64 Chromium }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 130
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # This job's two runners are macos-15 and windows-latest. Neither has apt or a timeout binary, so the bounding used
      # elsewhere in this repository has nothing to bound here and the step's timeout-minutes is the only bound.
      # Windows keeps --with-deps: there it installs the Server-Media-Foundation media pack, which is not apt and is
      # still needed. macOS needs nothing beyond the browser.
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        working-directory: apps/web
        timeout-minutes: 12
        run: bunx playwright install --with-deps chromium
      - name: Install Chromium on macOS
        if: runner.os == 'macOS'
        working-directory: apps/web
        timeout-minutes: 12
        run: bunx playwright install chromium
      - name: Build the web app
        working-directory: apps/web
        run: bunx --bun vite build --outDir "$RUNNER_TEMP/web-dist" --emptyOutDir
      # Only now: the host's offer is open for 10 minutes from the moment this key arrives.
      - name: Publish this client's public key
        run: |
          mkdir -p "$RUNNER_TEMP/pubkey"
          bun apps/web/soak/seal.ts keygen "$RUNNER_TEMP/soak.key" > "$RUNNER_TEMP/pubkey/pubkey.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-pubkey-${{ matrix.name }}
          path: ${{ runner.temp }}/pubkey/pubkey.txt
          retention-days: 1
      - name: Wait for the host's pairing link
        run: |
          bun apps/web/soak/artifact.ts "soak-link-${{ matrix.name }}" "$RUNNER_TEMP/link" 2400
          bun apps/web/soak/seal.ts open "$RUNNER_TEMP/soak.key" "$RUNNER_TEMP/link/soak-link-${{ matrix.name }}.json" \
            > "$RUNNER_TEMP/link.txt"
      - name: Soak
        working-directory: apps/web
        env:
          SOAK_CLIENT: ${{ matrix.label }}
          SOAK_PREBUILT: ${{ runner.temp }}/web-dist
          SOAK_OUTPUT_DIR: ${{ runner.temp }}/playwright
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          SOAK_LINK_FILE="$RUNNER_TEMP/link.txt" SOAK_RESULT="$RUNNER_TEMP/result/soak-result-${{ matrix.name }}.json" \
            bunx playwright test -c soak/playwright.config.ts
      - name: Tell the host this client is done
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/done"
          echo done > "$RUNNER_TEMP/done/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-done-${{ matrix.name }}
          path: ${{ runner.temp }}/done/${{ matrix.name }}.txt
          retention-days: 1
      # Screenshots of a failed soak; the page holds no pairing secret once paired.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: soak-playwright-${{ matrix.name }}
          path: ${{ runner.temp }}/playwright/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-result-${{ matrix.name }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: warn

  report:
    name: Report
    needs: [client]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: soak-result-*
          merge-multiple: true
          path: results
      - name: Summary
        run: |
          {
            echo "## Relay soak ($SOAK_MINUTES min, host on macOS, relay $RELAY_URL)"
            echo
            bun apps/web/soak/report.ts results
          } >> "$GITHUB_STEP_SUMMARY"
          bun apps/web/soak/report.ts results

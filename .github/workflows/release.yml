name: Release

# A vX.Y.Z tag builds every artifact into a draft release, smoke-tests the uploaded files and then publishes it.
# A manual dispatch builds the same set into a draft release and leaves it a draft, so the pipeline can be proven
# without publishing anything. A tag's draft has its SHA256SUMS.txt signed before Publish, which refuses a draft without
# the signature (#2297). A published release is then mirrored into the release bucket behind get.doriterm.com and its
# channel moved (#1969, docs/releasing.md); a dispatch mirrors its draft into the staging bucket instead. Either way
# the version must match apps/desktop/package.json (release-version.ts).
# The macOS builds, and the standalone macOS host binaries install.sh downloads, are signed with a Developer ID
# certificate and notarized with an App Store Connect API key, from the repository secrets CSC_LINK (base64 .p12),
# CSC_KEY_PASSWORD, APPLE_API_KEY (.p8 contents), APPLE_API_KEY_ID and APPLE_API_ISSUER; the Version job fails before
# any build when one is missing. Windows builds are not signed: there is no Windows code-signing certificate yet.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build into a draft release, such as 0.2.0 or 0.2.0-rc.1 (apps/desktop/package.json's version, optionally with a prerelease suffix)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  # Never cancel a release half way through an upload.
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUN_VERSION: 1.4.4
  NODE_VERSION: 24

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve the version from apps/desktop/package.json
        id: resolve
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bun .github/scripts/release-version.ts "$REQUESTED"
      # A release is published with its CHANGELOG section as its notes; with no section, or an empty one, it stops here.
      # The release pull request writes that section from Unreleased and changes/unreleased/ (changelog-assemble.ts).
      - name: CHANGELOG.md has this release's section
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: bun .github/scripts/release-notes.ts --check "$VERSION"
      # Fail before an hour of builds rather than at upload: a published release is never rebuilt in place.
      - name: The release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error title=Release exists::$TAG is already published. Back up and delete that release first to rebuild it."
            exit 1
          fi
      - name: The macOS signing secrets are set
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Signing secrets missing::The macOS builds are signed and notarized, and these repository secrets are not set: ${missing[*]}"
            exit 1
          fi
      - name: Workflow summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Release version"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Version | ${VERSION:-not resolved} |"
            echo "| Trigger | $EVENT |"
            echo "| Commit | $GITHUB_SHA |"
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    # Notarizing the app and then the dmg can take Apple a while.
    timeout-minutes: ${{ matrix.os == 'mac' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, runner: macos-15, os: mac, arch: arm64, targets: dmg zip, files: dmg zip }
          - { name: macOS x64, runner: macos-15-intel, os: mac, arch: x64, targets: dmg zip, files: dmg zip }
          - { name: Windows x64, runner: windows-2025, os: win, arch: x64, targets: nsis, files: exe }
          - { name: Windows arm64, runner: windows-11-arm, os: win, arch: arm64, targets: nsis, files: exe }
          - { name: Linux x64, runner: ubuntu-24.04, os: linux, arch: x64, targets: AppImage deb, files: AppImage deb }
          - {
              name: Linux arm64,
              runner: ubuntu-24.04-arm,
              os: linux,
              arch: arm64,
              targets: AppImage deb,
              files: AppImage deb,
            }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Only the macOS Package step gets a certificate; Windows and Linux build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build the web client, the app and the host
        working-directory: apps/desktop
        env:
          # The host reports the version it is built as (apps/host/src/host-types.ts), a prerelease suffix included.
          DORIFACE_BUILD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          bun run build:web
          bun run build
          bun run build:host "${{ matrix.os }}-${{ matrix.arch }}"
      # Every runner builds its own platform, so the host it ships can be asked which version it reports (#1039).
      - name: The host reports this release's version
        working-directory: apps/desktop/dist/host/${{ matrix.os }}-${{ matrix.arch }}
        run: |
          host=./doriface-host
          [ "${{ matrix.os }}" != win ] || host=./doriface-host.exe
          reported=$("$host" --version)
          if [ "$reported" != "doriface-host $VERSION" ]; then
            echo "::error title=Host version::the host built for $VERSION reports \"$reported\""
            exit 1
          fi
          echo "$reported"
      - name: Package (electron-builder ${{ matrix.targets }})
        if: matrix.os != 'mac'
        working-directory: apps/desktop
        run: |
          bun x electron-builder --${{ matrix.os }} ${{ matrix.targets }} --${{ matrix.arch }} --publish never \
            "-c.extraMetadata.version=$VERSION"
      - name: App Store Connect API key
        if: matrix.os == 'mac'
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/notary"
          printf '%s\n' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/notary/AuthKey.p8"
      # electron-builder signs the app (hardened runtime, build/entitlements.mac.plist), its afterSign hook notarizes and
      # staples the app before the dmg and zip are made from it, and the dmg is then signed, notarized and stapled.
      - name: Package, sign and notarize (electron-builder ${{ matrix.targets }})
        if: matrix.os == 'mac'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DORIFACE_NOTARIZE: "1"
        run: |
          bun x electron-builder --mac ${{ matrix.targets }} --${{ matrix.arch }} --publish never \
            "-c.extraMetadata.version=$VERSION" -c.forceCodeSigning=true
          shopt -s nullglob
          dmgs=(dist/release/*"$VERSION"*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error title=Missing artifact::expected one .dmg for $VERSION, found ${#dmgs[@]}"
            exit 1
          fi
          bash ../../.github/scripts/macos-notarize.sh "${dmgs[0]}"
      # install.sh (#668) downloads the standalone host as a bare binary, outside the app electron-builder signs, and bun
      # build --compile leaves it only an ad-hoc signature, which Gatekeeper rejects (#1992). It is signed with the app's
      # Developer ID certificate under the hardened runtime, then notarized as a zip; a bare binary cannot be stapled.
      - name: Sign and notarize the standalone host
        if: matrix.os == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/notary/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          HOST: apps/desktop/dist/host/${{ matrix.os }}-${{ matrix.arch }}/doriface-host
        run: |
          bash .github/scripts/macos-sign-binary.sh "$HOST" apps/desktop/build/entitlements.host.mac.plist
          # The hardened runtime kills a bun binary at its first start when its entitlements do not let it JIT.
          "$HOST" --version
          bash .github/scripts/macos-notarize.sh "$HOST"
      - name: Forget the App Store Connect API key
        if: always() && matrix.os == 'mac'
        run: rm -rf "$RUNNER_TEMP/notary"
      - name: The app and the dmg are signed, notarized and stapled
        if: matrix.os == 'mac'
        working-directory: apps/desktop/dist/release
        run: |
          shopt -s nullglob
          apps=(mac*/Doriterm.app)
          dmgs=(*"$VERSION"*.dmg)
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          spctl -a -vv -t exec "${apps[0]}" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl-app.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/macos-stapler.sh" validate "${apps[0]}"
          spctl -a -vv -t open --context context:primary-signature "${dmgs[0]}" 2>&1 | tee "$RUNNER_TEMP/spctl-dmg.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl-dmg.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/macos-stapler.sh" validate "${dmgs[0]}"
      - name: The standalone host is signed and notarized
        if: matrix.os == 'mac'
        run: bash .github/scripts/macos-assess-binary.sh "apps/desktop/dist/host/${{ matrix.os }}-${{ matrix.arch }}/doriface-host"
      # The zip's and the installer's .blockmap let electron-updater download only the blocks that changed since the
      # installed version. The dmg's is left out: stapling changed the dmg after electron-builder wrote it, and the updater
      # never downloads the dmg.
      - name: Collect ${{ matrix.files }}
        working-directory: apps/desktop/dist/release
        run: |
          shopt -s nullglob
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          for ext in ${{ matrix.files }}; do
            found=(*"$VERSION"*."$ext")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error title=Missing artifact::expected one .$ext for $VERSION, found ${#found[@]}"
              ls -la
              exit 1
            fi
            cp "${found[0]}" "$out/"
            case "$ext" in
              zip | exe)
                if [ ! -f "${found[0]}.blockmap" ]; then
                  echo "::error title=Missing blockmap::electron-builder wrote no ${found[0]}.blockmap"
                  exit 1
                fi
                cp "${found[0]}.blockmap" "$out/"
                ;;
            esac
          done
          ls -la "$out"
      # install.sh (#668) downloads this binary on Linux and macOS; Windows gets the host inside the desktop installer.
      - name: Collect the standalone host
        if: matrix.os != 'win'
        run: cp "apps/desktop/dist/host/${{ matrix.os }}-${{ matrix.arch }}/doriface-host" "$RUNNER_TEMP/out/doriface-host-${{ matrix.os }}-${{ matrix.arch }}"
      # electron-updater's feed: an installed app reads latest-mac.yml, latest.yml or latest-linux*.yml from the release to
      # find an update. This runner's copy goes up in its own folder; the release job merges the runners' copies into one.
      - name: Collect the update feed
        working-directory: apps/desktop/dist/release
        run: |
          shopt -s nullglob
          feed=(latest*.yml)
          if [ "${#feed[@]}" -eq 0 ]; then
            echo "::error title=Missing update feed::electron-builder wrote no latest*.yml"
            ls -la
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/out/feed-${{ matrix.os }}-${{ matrix.arch }}"
          cp "${feed[@]}" "$RUNNER_TEMP/out/feed-${{ matrix.os }}-${{ matrix.arch }}/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Desktop ${{ matrix.name }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Runner | ${{ matrix.runner }} (${{ runner.os }} ${{ runner.arch }}) |"
            echo "| Version | $VERSION |"
            echo "| Targets | ${{ matrix.targets }} |"
            echo
            # out/ holds the update feed in a folder (feed-<os>-<arch>/), so list one level down too. `|| continue` rather
            # than `[ -f ] && echo`: a test that fails on the loop's last entry is the loop's status, and so the step's.
            for file in "$RUNNER_TEMP"/out/* "$RUNNER_TEMP"/out/*/*; do
              [ -f "$file" ] || continue
              echo "- \`${file#"$RUNNER_TEMP"/out/}\` ($(wc -c < "$file" | tr -d ' ') bytes)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - run: bun install --frozen-lockfile
      - name: Build apps/web
        run: bun run --cwd apps/web build
      - name: Zip the build
        working-directory: apps/web/dist
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          zip -qrX "$RUNNER_TEMP/out/doriterm-web-$VERSION.zip" .
          unzip -l "$RUNNER_TEMP/out/doriterm-web-$VERSION.zip" | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Web"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Version | $VERSION |"
            echo "| Artifact | doriterm-web-$VERSION.zip |"
          } >> "$GITHUB_STEP_SUMMARY"

  # #670: the candidate's web client against the last published release's on one runner. A rendering regression past
  # apps/web/bench/thresholds.json fails this job, so no draft is made and nothing is published; the table and the runs
  # (Doriterm-<version>-render-bench.md and .json) are attached to the release with the other files.
  render-bench:
    name: Render bench
    needs: version
    uses: ./.github/workflows/render-bench.yml
    with:
      label: ${{ needs.version.outputs.version }}

  release:
    name: Draft release
    needs: [version, desktop, web, render-bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      # Stamped with this tag, so the installer from a release installs that release rather than whatever is latest.
      - name: The host installer
        run: sed "s/__DORIFACE_RELEASE__/$TAG/" apps/host/install/install.sh > assets/install.sh
      - name: The update feed, one file per name for every architecture
        run: bun .github/scripts/merge-update-feed.ts assets "$VERSION"
      - name: SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum -- * | sort -k 2 > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: bun .github/scripts/release-notes.ts "$VERSION" assets > "$RUNNER_TEMP/notes.md"
      - name: Create or refresh the draft release
        run: |
          pre=()
          [ "$PRERELEASE" = true ] && pre=(--prerelease)
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            false)
              echo "::error title=Release exists::$TAG is already published; it is never rebuilt in place."
              exit 1
              ;;
            true)
              # A re-run: replace the earlier run's assets so nothing stale stays attached.
              gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
                gh release delete-asset "$TAG" "$name" --yes
              done
              gh release edit "$TAG" --title "Doriterm $TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" "${pre[@]}"
              ;;
            *)
              gh release create "$TAG" --draft --title "Doriterm $TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" "${pre[@]}"
              ;;
          esac
          gh release upload "$TAG" assets/*
      - name: Every asset is attached at its size
        run: |
          (cd assets && for file in *; do echo "$file $(wc -c < "$file" | tr -d ' ')"; done) | sort > "$RUNNER_TEMP/local.txt"
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > "$RUNNER_TEMP/remote.txt"
          diff -u "$RUNNER_TEMP/local.txt" "$RUNNER_TEMP/remote.txt"
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Draft release $TAG"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Prerelease | $PRERELEASE |"
            echo "| Commit | $GITHUB_SHA |"
            echo
            echo '```'
            cat assets/SHA256SUMS.txt 2>/dev/null || echo "no checksums"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-linux:
    name: Smoke Linux x64 AppImage
    needs: [version, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # A draft release is only visible to a token that can write to the repository.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.21/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Download the AppImage from the draft release
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          gh release download "$TAG" --pattern SHA256SUMS.txt --pattern "Doriterm-$VERSION-x86_64.AppImage"
          sha256sum --check --ignore-missing --strict SHA256SUMS.txt
          chmod +x "Doriterm-$VERSION-x86_64.AppImage"
          echo "APPIMAGE=$RUNNER_TEMP/dl/Doriterm-$VERSION-x86_64.AppImage" >> "$GITHUB_ENV"
      # The AppImage carries its own statically linked FUSE 2 runtime, so it needs no libfuse.so.2: stock Ubuntu 24.04
      # ships FUSE 3 only, and a missing libfuse.so.2 is the "dlopen(): error loading libfuse.so.2" users hit. This step
      # fails when the library is present, so the launch below can never pass on a machine that hides the dependency.
      # Ubuntu's AppArmor also blocks the user namespaces Chromium's sandbox needs, and the app keeps its sandbox on.
      - name: No FUSE 2 on this runner, and the Chromium sandbox
        run: |
          if ldconfig -p | grep -q 'libfuse\.so\.2'; then
            echo "::error title=libfuse.so.2 is installed::the AppImage launch would not prove it carries its own runtime"
            ldconfig -p | grep 'libfuse\.so\.2'
            exit 1
          fi
          if [ ! -e /dev/fuse ]; then
            echo "::error title=No /dev/fuse::the AppImage runtime mounts its payload through the kernel's FUSE"
            exit 1
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The AppImage launches and attaches a terminal
        working-directory: apps/desktop
        env:
          DORIFACE_E2E_EXECUTABLE: ${{ env.APPIMAGE }}
          DEBUG: pw:browser
        run: xvfb-run --auto-servernum bun run test:e2e e2e/launch.e2e.ts e2e/terminal.e2e.ts
      # docs/getting-started.md through the hosted relay (#672): this AppImage's host dials relay-doriface.omo.dev, and a
      # fresh browser opens the QR code's hosted pair page, pairs and types into a terminal on this runner.
      # It depends on relay-doriface.omo.dev and doriface.omo.dev being up and has no retries, so an outage of either holds
      # Publish until this job is re-run.
      - name: The user guide pairs through the hosted relay
        working-directory: apps/desktop
        env:
          DORIFACE_E2E_EXECUTABLE: ${{ env.APPIMAGE }}
          DORIFACE_HOSTED_RELAY_SMOKE: "1"
        run: xvfb-run --auto-servernum bun run test:e2e e2e/hosted-relay-pair.e2e.ts
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Smoke: Linux x64 AppImage from the draft release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| File | Doriterm-$VERSION-x86_64.AppImage |"
            echo "| Checks | launch.e2e.ts, terminal.e2e.ts and hosted-relay-pair.e2e.ts (pairs through relay-doriface.omo.dev) against the downloaded file |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-mac:
    name: Smoke macOS arm64 zip and dmg
    needs: [version, release]
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Download the zip, the dmg and the standalone host from the draft release
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          zip="Doriterm-$VERSION-arm64-mac.zip"
          dmg="Doriterm-$VERSION-arm64.dmg"
          host=doriface-host-mac-arm64
          gh release download "$TAG" --pattern SHA256SUMS.txt --pattern "$zip" --pattern "$dmg" --pattern "$host"
          grep -E "  ($zip|$dmg|$host)\$" SHA256SUMS.txt | shasum -a 256 --check
          ditto -x -k "$zip" app
      - name: The dmg is notarized and stapled
        working-directory: ${{ runner.temp }}/dl
        run: |
          dmg="Doriterm-$VERSION-arm64.dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1 | tee spctl-dmg.txt
          grep -q "source=Notarized Developer ID" spctl-dmg.txt
          bash "$GITHUB_WORKSPACE/.github/scripts/macos-stapler.sh" validate "$dmg"
      - name: The app is signed and notarized, carries the version and starts
        working-directory: ${{ runner.temp }}/dl/app
        run: |
          codesign --verify --deep --strict --verbose=2 Doriterm.app
          spctl -a -vv -t exec Doriterm.app 2>&1 | tee ../spctl-app.txt
          grep -q "source=Notarized Developer ID" ../spctl-app.txt
          bash "$GITHUB_WORKSPACE/.github/scripts/macos-stapler.sh" validate Doriterm.app
          bundled=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Doriterm.app/Contents/Info.plist)
          if [ "$bundled" != "$VERSION" ]; then
            echo "::error::the app says $bundled, expected $VERSION"
            exit 1
          fi
          # Chromium prints this line once its browser process is up; wait for it, bounded, then check it is still running.
          Doriterm.app/Contents/MacOS/Doriterm --remote-debugging-port=0 > launch.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            grep -q "DevTools listening on" launch.log && break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          cat launch.log
          grep -q "DevTools listening on" launch.log
          kill -0 "$pid"
          kill "$pid"
      - name: The standalone host is signed and notarized and starts
        working-directory: ${{ runner.temp }}/dl
        run: |
          chmod +x doriface-host-mac-arm64
          bash "$GITHUB_WORKSPACE/.github/scripts/macos-assess-binary.sh" doriface-host-mac-arm64
          ./doriface-host-mac-arm64 --version
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Smoke: macOS arm64 zip and dmg from the draft release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| File | Doriterm-$VERSION-arm64-mac.zip |"
            echo "| Checks | checksums, codesign --verify, spctl (Notarized Developer ID), stapler validate, bundle version, launch; doriface-host-mac-arm64: codesign --verify --strict, Developer ID, hardened runtime, spctl -t install (Notarized Developer ID), --version |"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-windows:
    name: Smoke Windows ${{ matrix.arch }} setup.exe
    needs: [version, release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      SETUP: Doriterm-${{ needs.version.outputs.version }}-${{ matrix.arch }}-setup.exe
      # Git Bash would turn the installer's /S flag into a path.
      MSYS2_ARG_CONV_EXCL: "*"
    steps:
      - name: Download the installer from the draft release
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          gh release download "$TAG" --pattern SHA256SUMS.txt --pattern "$SETUP"
          grep -E "  $SETUP\$" SHA256SUMS.txt | sha256sum --check --strict
      - name: Install it for this user, silently
        working-directory: ${{ runner.temp }}/dl
        run: |
          "./$SETUP" /S
          # The one-click installer puts the app under the user's Programs folder; find it there, bounded.
          for _ in $(seq 1 60); do
            host=$(find "$LOCALAPPDATA/Programs" -maxdepth 4 -name doriface-host.exe 2>/dev/null | head -1)
            [ -n "$host" ] && break
            sleep 2
          done
          if [ -z "$host" ]; then
            echo "::error::no doriface-host.exe under $LOCALAPPDATA/Programs after the install"
            find "$LOCALAPPDATA/Programs" -maxdepth 3 2>/dev/null | head -50
            exit 1
          fi
          app="$(dirname "$(dirname "$(dirname "$host")")")/Doriterm.exe"
          test -f "$app"
          echo "HOST_EXE=$host" >> "$GITHUB_ENV"
          echo "APP_EXE=$app" >> "$GITHUB_ENV"
          echo "host: $host"
          echo "app: $app"
      # #406: the packaged host created its keys and then refused them. Two starts on one state folder under the
      # profile (the trusted namespace the host requires) must create, re-check and reload the same identity.
      - name: The packaged host keeps its keys across two starts
        run: |
          state="$USERPROFILE/.doriterm-release-smoke"
          first=$("$HOST_EXE" fingerprint --state-dir "$state")
          second=$("$HOST_EXE" fingerprint --state-dir "$state")
          echo "first:  $first"
          echo "second: $second"
          [[ "$first" =~ ^([0-9A-F]{4}\ ){9}[0-9A-F]{4}$ ]]
          test "$first" = "$second"
      - name: The app carries the version and starts
        shell: pwsh
        run: |
          # Windows keeps a four-part numeric version, so 0.1.1-rc.2 is recorded as 0.1.1.0.
          $expected = "$(($env:VERSION -split "-")[0]).0"
          $product = (Get-Item $env:APP_EXE).VersionInfo.ProductVersion
          if ($product -ne $expected) { Write-Error "the app says $product, expected $expected (for $env:VERSION)"; exit 1 }
          # Chromium prints this line once its browser process is up; wait for it, bounded, then check it still runs.
          $log = Join-Path $env:RUNNER_TEMP "launch.log"
          $proc = Start-Process -FilePath $env:APP_EXE -ArgumentList "--remote-debugging-port=0", "--enable-logging=stderr" `
            -RedirectStandardError $log -RedirectStandardOutput "$log.out" -PassThru
          $up = $false
          foreach ($i in 1..60) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "DevTools listening on" -Quiet)) { $up = $true; break }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          Get-Content $log -ErrorAction SilentlyContinue
          if (-not $up) { Write-Error "the app did not bring up its browser process"; exit 1 }
          if ($proc.HasExited) { Write-Error "the app exited after starting (code $($proc.ExitCode))"; exit 1 }
          Stop-Process -Id $proc.Id
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Smoke: Windows ${{ matrix.arch }} setup.exe from the draft release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| File | $SETUP |"
            echo "| Checks | checksum, silent per-user install, packaged host fingerprint twice (same identity), app version, launch |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs the draft's SHA256SUMS.txt before Publish, apart from any mirror, so neither a staging bucket that already holds
  # this version nor a channel that offers a newer one can keep a release unsigned (#2297). The key lives only in the
  # release-mirror environments (staging's allows release tags); Ed25519 is deterministic, so the production mirror's
  # signature is the same bytes.
  sign:
    name: Sign the draft's checksums
    if: github.event_name == 'push'
    needs: [version, smoke-linux, smoke-mac, smoke-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-mirror-staging
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Download the draft's checksums
        run: gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/sign"
      - name: Sign them
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bun .github/scripts/release-r2.ts sign --dir "$RUNNER_TEMP/sign"
      - name: Attach the signature to the draft
        run: gh release upload "$TAG" "$RUNNER_TEMP/sign/SHA256SUMS.txt.sig" --clobber

  publish:
    name: Publish
    if: github.event_name == 'push'
    # The sign job puts SHA256SUMS.txt.sig on the draft, and the first step refuses without it: a release is never public
    # unsigned (#2297).
    needs: [version, smoke-linux, smoke-mac, smoke-windows, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: The draft carries its signature
        run: |
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS.txt.sig; then
            echo "::error title=Publish::$TAG has no SHA256SUMS.txt.sig, so it stays a draft; re-run the Sign job"
            exit 1
          fi
      - name: Publish the draft
        run: gh release edit "$TAG" --draft=false
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Publish $TAG"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The mirror job lives in release-mirror.yml (run by hand for an already-published release); these call it.
  mirror:
    name: Mirror to get.doriterm.com
    if: github.event_name == 'push'
    needs: [version, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/release-mirror.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      target: production
    secrets: inherit

  mirror-staging:
    name: Mirror the draft to staging.get.doriterm.com
    if: github.event_name == 'workflow_dispatch'
    needs: [version, smoke-linux, smoke-mac, smoke-windows]
    permissions:
      contents: write
    uses: ./.github/workflows/release-mirror.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      target: staging
      published: false
    secrets: inherit

name: CI

on:
  push:
    branches: [dev]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # tsc and the web build run under Node; the same Node 24 as the relay job.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.17/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 82ec44043f6894bfdb716b979b87cda43fd7fa46b0104e7b7bd93e64d1a9b877
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      - name: Build apps/web
        run: bun run --cwd apps/web build

  relay-e2e:
    name: Relay e2e
    runs-on: ubuntu-latest
    # The relay and mesh suites (tests/relay): real hosts, hc cores and the private relay under wrangler dev, in
    # parallel with Check so neither waits on the other.
    timeout-minutes: 25
    env:
      # Pull requests from forks get no secrets; only they may skip the relay suites (see the last step).
      RELAY_TOKEN_SET: ${{ secrets.DORIFACE_RELAY_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The relay suites run the private relay under wrangler dev, which needs Node 22 or newer.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.17/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 82ec44043f6894bfdb716b979b87cda43fd7fa46b0104e7b7bd93e64d1a9b877
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - run: bun install --frozen-lockfile
      # The relay server is deployed separately, from its own private repository, named by the RELAY_REPO secret so
      # that Actions masks it in the log. tests/relay runs this repository's host and client against it at the commit
      # relay-pin.json names, cloned over HTTPS with a fine-grained token that can only read that repository. git asks a
      # step-scoped credential helper for it, so it never appears in a URL, an argument or the log (Actions masks
      # secrets as well).
      - name: Fetch the private relay
        if: env.RELAY_TOKEN_SET == 'true'
        env:
          RELAY_READ_TOKEN: ${{ secrets.DORIFACE_RELAY_READ_TOKEN }}
          RELAY_REPO: ${{ secrets.RELAY_REPO }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$RELAY_READ_TOKEN"; }; f'
        run: bun run relay:fetch
      - name: Relay suites against the private relay
        if: env.RELAY_TOKEN_SET == 'true'
        # A mesh scenario whose capability is missing fails instead of being skipped.
        env:
          DORIFACE_MESH_E2E: require
        run: bun run relay:test
      # mesh-attach.e2e.ts is a browser spec that needs this job's relay checkout: the web app paired with one mesh
      # member attaches to a terminal on another, through the mesh (G009 C004). Web e2e has no relay, so it skips it.
      - uses: actions/cache@v4
        if: env.RELAY_TOKEN_SET == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        if: env.RELAY_TOKEN_SET == 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Browser spec through the mesh
        if: env.RELAY_TOKEN_SET == 'true'
        run: bun run test:e2e e2e/mesh-attach.e2e.ts
        working-directory: apps/web
        env:
          CI: "1"
          DORIFACE_RELAY_DIR: ${{ github.workspace }}/.relay
      - if: always() && env.RELAY_TOKEN_SET == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relay-web-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: Relay suites without the token
        if: env.RELAY_TOKEN_SET != 'true'
        env:
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = true ]; then
            echo "::notice::Pull requests from forks get no secrets; the relay suites in tests/relay did not run."
          else
            echo "::error::DORIFACE_RELAY_READ_TOKEN is not set, so the relay suites in tests/relay cannot run."
            exit 1
          fi

  web-e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.17/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 82ec44043f6894bfdb716b979b87cda43fd7fa46b0104e7b7bd93e64d1a9b877
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      # The e2e workers follow the runner's cores (playwright.config.ts, #342): record what this runner has.
      - name: Runner resources
        run: |
          echo "cores: $(nproc)"
          free -m
      - name: Playwright e2e against a real hc
        run: bun run test:e2e
        working-directory: apps/web
        env:
          CI: "1"
      - name: Two e2e runs at once, each on its own ports (#37)
        run: bun run test:e2e:two-runs
        working-directory: apps/web
        env:
          CI: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.17/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 82ec44043f6894bfdb716b979b87cda43fd7fa46b0104e7b7bd93e64d1a9b877
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      # Ubuntu's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs; the app keeps its sandbox on.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Package (electron-builder --dir)
        working-directory: apps/desktop
        run: bun run pack
      # Installing and packing must not rewrite tracked files: a declared bin that is not committed executable gets chmodded.
      - name: The tree is clean after install and pack
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat --summary
            git --no-pager diff
            exit 1
          fi
      - name: Launch the packaged app
        working-directory: apps/desktop
        env:
          DORIFACE_E2E_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/release/linux-unpacked/doriface
          # Electron's own stdout/stderr, so a launch that never connects says why.
          DEBUG: pw:browser
        run: xvfb-run --auto-servernum bun run test:e2e

  desktop-macos:
    # The desktop app ships for macOS first (signed and notarized dmg and zip), and part of its suite only runs there:
    # the hidden-inset titlebar spec and the app-menu spec skip on every other platform, and the shortcut, split-focus
    # and pairing-link specs take their Command branch only on a Mac (#609). Without this job those paths reach dev
    # unproven.
    name: Desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # A macOS runner bills ten times a Linux one, so the suite only runs when the change can reach the app: the shell
      # itself, the web client and host binary it packages, and the workspaces under them.
      - name: Decide whether this change reaches the desktop app
        id: scope
        run: |
          set -u
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
          else
            base="${{ github.event.before }}"
          fi
          match=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] &&
            git fetch --no-tags --depth=1 origin "$base" > /dev/null 2>&1; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf '%s\n' "$changed"
            match=false
            if printf '%s\n' "$changed" |
              grep -Eq '^(apps/desktop|apps/web|apps/host|packages|patches)/|^(bun\.lock|package\.json|tsconfig\.base\.json|\.github/workflows/ci\.yml)$'; then
              match=true
            fi
          else
            echo "no readable base commit: running the suite"
          fi
          echo "match=$match" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.scope.outputs.match == 'true'
        with:
          bun-version: 1.4.4
      # bun's install cache and Electron's own downloads; the packed app itself is rebuilt every run.
      - uses: actions/cache@v4
        if: steps.scope.outputs.match == 'true'
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: macos-${{ runner.arch }}-
      - name: Install herdr-core
        if: steps.scope.outputs.match == 'true'
        env:
          HC_SHA256_AARCH64: cedbd4d4d9ba1385588198dd4d3c67d2654478f33add5b6445d4d0eb9da5fcf3
          HC_SHA256_X86_64: e2dc3211edb1f1c77d0e73dd76c1426636d71050f34a5303916a56d363d7062b
        run: |
          case "${{ runner.arch }}" in
            X64) arch=x86_64; sha="$HC_SHA256_X86_64" ;;
            *) arch=aarch64; sha="$HC_SHA256_AARCH64" ;;
          esac
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "https://releases.herdr.dev/core/0.1.17/herdr-core-macos-$arch.tar.gz" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$sha  $RUNNER_TEMP/hc.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - name: Install dependencies
        if: steps.scope.outputs.match == 'true'
        run: bun install --frozen-lockfile
      - name: Desktop units
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        run: bun test
      - name: Package (electron-builder --dir)
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        run: bun run pack
      # Installing and packing must not rewrite tracked files (the same check the Linux Desktop job makes).
      - name: The tree is clean after install and pack
        if: steps.scope.outputs.match == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat --summary
            git --no-pager diff
            exit 1
          fi
      # CI points the specs at electron-builder --dir output so the app that launches is the packaged one, as on Linux.
      - name: Find the packaged app
        if: steps.scope.outputs.match == 'true'
        run: |
          app="$(find apps/desktop/dist/release -maxdepth 2 -name doriface.app -print -quit)"
          test -n "$app"
          echo "DORIFACE_E2E_EXECUTABLE=$PWD/$app/Contents/MacOS/doriface" >> "$GITHUB_ENV"
      - name: Launch the packaged app
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        env:
          CI: "1"
          # Electron's own stdout/stderr, so a launch that never connects says why.
          DEBUG: pw:browser
        run: bun run test:e2e
      - if: always() && steps.scope.outputs.match == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-e2e
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore

  windows-private-state:
    # Host key custody on Windows (#406): ACLs, not POSIX mode bits. Both supported Windows architectures run the
    # real-ACL suite and the compiled host, so bun:ffi is proven in the packaged binary too.
    name: Windows private state (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: win-x64 }
          - { arch: arm64, runner: windows-11-arm, target: win-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Real-ACL suite (every case must run; a skip fails the job)
        shell: bash
        run: |
          bun test apps/host/src/state/win32 2>&1 | tee win32.log
          grep -E '^ +0 fail' win32.log
          ! grep -E '^ +[1-9][0-9]* skip' win32.log
          grep -E '^\(pass\) .*W[0-9]+ ' win32.log
      - name: The state units on Windows
        run: bun test apps/host/src/state/host-keys.test.ts apps/host/src/state/known-hosts.test.ts
      - name: Compiled host keeps its keys across two starts
        shell: bash
        run: |
          bun run --cwd apps/desktop build:host ${{ matrix.target }}
          host="apps/desktop/dist/host/${{ matrix.target }}/doriface-host.exe"
          state="$USERPROFILE/.doriface-406-state"  # under the profile: $RUNNER_TEMP sits on runner paths other accounts may re-permission, which the namespace rule refuses
          first=$("$host" fingerprint --state-dir "$state")
          second=$("$host" fingerprint --state-dir "$state")
          echo "$first"
          test -n "$first" && test "$first" = "$second"

  ghostty-wasm:
    name: Ghostty wasm provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify the committed wasm against wasm/build.json
        run: bun packages/ghostty-wasm/scripts/verify.ts

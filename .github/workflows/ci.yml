name: CI

on:
  push:
    branches: [dev]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# A pull request into dev must pass three checks: Check, Relay e2e and Web e2e. The platform jobs — Desktop,
# Desktop (macOS) and Windows private state — are gated to a push on dev, so they run after the merge and never on a
# pull request; the CI section of README.md says the same for a reader.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # tsc and the web build run under Node; the same Node 24 as the relay job.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - run: bun install --frozen-lockfile
      # The read-only token that fetches the private relay expires (#38): warn from 60 days out and error once it has
      # passed, on every push, so the date reaches the run page without anyone watching a calendar.
      - name: Relay read token expiry
        run: bun tests/relay-fetch/token-expiry.ts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test
      - name: Build apps/web
        run: bun run --cwd apps/web build
      - name: Build apps/landing
        run: bun run --cwd apps/landing build

  install-linux:
    # The one-step host install (#668) on a runner with no herdr-core: it must end with a running user service and a
    # printed QR code. Not a required check; it runs on pull requests because it costs a Linux minute or two.
    name: Install (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # A runner job has no login session, so no systemd user manager answers until the runner user lingers.
      - name: Start the runner user's systemd manager
        run: |
          sudo loginctl enable-linger "$USER"
          runtime="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment >/dev/null 2>&1 && exit 0
            sleep 0.2
          done
          echo "::error::no systemd user manager for $USER" && exit 1
      - name: The installer installs, starts and pairs
        run: bash .github/scripts/install-smoke.sh linux-x64
      - name: Host log
        if: failure()
        run: journalctl --user -u doriface-host --no-pager | tail -100

  install-macos:
    # The same on a Mac, with a LaunchAgent. Like the other macOS job it runs after the merge, on the push to dev.
    name: Install (macOS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: The installer installs, starts and pairs
        run: bash .github/scripts/install-smoke.sh mac-arm64
      - name: Host log
        if: failure()
        run: tail -100 ~/Library/Logs/doriface-host.log || true

  relay-e2e:
    # This job is the only reporter of the required "Relay e2e" context, so it carries that name only on the paths that
    # can run the suites. A pull request from a fork gets no secrets: it reports under another name, so the required
    # context is never reported for it and it cannot merge until a run inside this repository does that work
    # (CONTRIBUTING.md, "Pull requests from forks"). A skipped job would not close this: a skipped check is reported as
    # a success. A path that loses the token reports the required name and fails, so a missing secret is loud.
    name: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'Relay e2e (fork: not run)' || 'Relay e2e' }}"
    runs-on: ubuntu-latest
    # The relay and mesh suites (tests/relay): real hosts, hc cores and the private relay under wrangler dev, in
    # parallel with Check so neither waits on the other.
    # Measured on a loaded hosted runner (#2027): relay:test ~12 min, then the browser step ~13 min at one worker, of
    # which keystroke-latency-relay's 12-case matrix is ~10.5 min. At 25 the job was cancelled with a spec still running.
    timeout-minutes: 40
    env:
      # Pull requests from forks get no secrets; only they may skip the relay suites (see the first step).
      RELAY_TOKEN_SET: ${{ secrets.DORIFACE_RELAY_READ_TOKEN != '' }}
    steps:
      # First, so a missing token is answered in seconds instead of after the toolchain is installed.
      - name: The relay suites need the read token
        if: env.RELAY_TOKEN_SET != 'true'
        env:
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = true ]; then
            echo "::notice title=Relay e2e (fork: not run)::A pull request from a fork has no DORIFACE_RELAY_READ_TOKEN, so the relay and mesh suites in tests/relay did not run. This job reports under another name, so the required 'Relay e2e' check stays unreported and the pull request cannot merge until a run inside this repository does it: see CONTRIBUTING.md, 'Pull requests from forks'."
          else
            echo "::error::DORIFACE_RELAY_READ_TOKEN is not set, so the relay suites in tests/relay cannot run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RELAY_TOKEN_SET == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.RELAY_TOKEN_SET == 'true'
        with:
          bun-version: 1.4.4
      # The relay suites run the private relay under wrangler dev, which needs Node 22 or newer.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: env.RELAY_TOKEN_SET == 'true'
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.RELAY_TOKEN_SET == 'true'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        if: env.RELAY_TOKEN_SET == 'true'
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - if: env.RELAY_TOKEN_SET == 'true'
        run: bun install --frozen-lockfile
      # The relay server is deployed separately, from its own private repository, named by the RELAY_REPO secret so
      # that Actions masks it in the log. tests/relay runs this repository's host and client against it at the commit
      # relay-pin.json names, cloned over HTTPS with a fine-grained token that can only read that repository. git asks a
      # step-scoped credential helper for it, so it never appears in a URL, an argument or the log (Actions masks
      # secrets as well).
      - name: Fetch the private relay
        if: env.RELAY_TOKEN_SET == 'true'
        env:
          RELAY_READ_TOKEN: ${{ secrets.DORIFACE_RELAY_READ_TOKEN }}
          RELAY_REPO: ${{ secrets.RELAY_REPO }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && printf "username=x-access-token\npassword=%s\n" "$RELAY_READ_TOKEN"; }; f'
        run: bun run relay:fetch
      - name: Relay suites against the private relay
        if: env.RELAY_TOKEN_SET == 'true'
        # A mesh scenario whose capability is missing fails instead of being skipped.
        env:
          DORIFACE_MESH_E2E: require
        # The JUnit report is what the next step counts: a green run of nothing is not a pass.
        run: bun run relay:test -- --reporter=junit --reporter-outfile="$RUNNER_TEMP/relay-suites.xml"
      - name: The relay and mesh suites ran
        if: env.RELAY_TOKEN_SET == 'true'
        # The required "Relay e2e" context may only be green when the suites above produced cases, so this reads their
        # report: every case must have run (no skip), nothing may fail, and the mesh and relay e2e specs must be in it.
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/relay-suites.xml"
          if [ ! -s "$report" ]; then
            echo "::error::$report is missing or empty, so the relay suites reported nothing."
            exit 1
          fi
          total=$(grep -c '<testcase ' "$report" || true)
          failures=$(grep -c '<failure' "$report" || true)
          skipped=$(grep -c '<skipped' "$report" || true)
          mesh=$(grep -oE 'file="tests/relay/mesh-[^"]+\.test\.ts"' "$report" | sort -u | wc -l || true)
          echo "cases: $total, failures: $failures, skipped: $skipped, mesh specs: $mesh"
          if [ "$failures" -ne 0 ]; then
            echo "::error::the relay suites report $failures failing cases."
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped cases were skipped; every case of these suites has to run here."
            exit 1
          fi
          if [ "$total" -lt 1 ] || [ "$mesh" -lt 1 ]; then
            echo "::error::the relay suites ran $total cases and $mesh mesh specs, so they are not the suites this check exists for."
            exit 1
          fi
          if ! grep -q 'file="tests/relay/e2e.test.ts"' "$report"; then
            echo "::error::tests/relay/e2e.test.ts did not run."
            exit 1
          fi
      # mesh-attach.e2e.ts, mesh-input-hold.e2e.ts and mesh-join-browser.e2e.ts are browser specs that need this job's relay
      # checkout: the web app paired with one mesh member attaches to a terminal on another, through the mesh (G009 C004);
      # mesh-input-hold.e2e.ts types into that terminal while the other member's line is down (#1489); and a browser joins
      # a two-machine mesh as its own member with its own WebCrypto and IndexedDB (#1413). Web e2e has no relay, so it
      # skips all three. They run one worker after the other: each starts two hosts, the relay and Chromium, and two of
      # those at once do not fit one runner's cores.
      - name: Playwright version
        if: env.RELAY_TOKEN_SET == 'true'
        id: playwright
        working-directory: apps/web
        run: |
          echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "distro=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.RELAY_TOKEN_SET == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('bun.lock') }}
      # The .deb files of the system packages Chromium is missing on the image (doriterm#1012); the install step decides
      # whether they are enough, so this only restores them.
      - name: Restore the Playwright system packages
        if: env.RELAY_TOKEN_SET == 'true'
        id: playwright-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          # One key per run: a set saved after an archive update can never overwrite an older one, so the newest wins by prefix.
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.distro }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('.github/scripts/playwright-linux-deps.sh') }}-${{ github.run_id }}
          restore-keys: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.distro }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('.github/scripts/playwright-linux-deps.sh') }}-
      - name: Install Chromium
        if: env.RELAY_TOKEN_SET == 'true'
        id: chromium
        working-directory: apps/web
        timeout-minutes: 12
        run: |
          # The browser binary and the system packages are cached separately. playwright-linux-deps.sh installs the
          # packages from their cache only when Playwright's own check finds its whole list installed, and from the apt
          # mirror otherwise: doriterm#1012, a mirror at ~38 kB/s ran the every-run download past its limit, and
          # doriterm#915, skipping the packages instead cost the Korean width assertions their fonts. The installs are
          # bounded by timeout, and the step by timeout-minutes (doriterm#914).
          bash "$GITHUB_WORKSPACE/.github/scripts/playwright-linux-deps.sh" "$HOME/.cache/playwright-apt"
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" >/dev/null; then
            echo "browser cache hit: installing the engine without downloading it again"
            timeout 300 bunx playwright install chromium
          else
            timeout 600 bunx playwright install chromium
          fi
      - name: Save the Playwright system packages
        if: env.RELAY_TOKEN_SET == 'true' && steps.chromium.outputs.save-debs == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}
      # Every browser spec that needs this job's relay checkout runs here, one worker, as listed on the line below: the mesh
      # specs above and those that go through the real relay code (keystroke-latency-relay's JSON files land in
      # apps/web/test-results). A name that matches no file yet runs nothing and fails nothing.
      - name: Browser spec through the mesh
        if: env.RELAY_TOKEN_SET == 'true'
        run: bun run test:e2e e2e/mesh-attach.e2e.ts e2e/mesh-input-hold.e2e.ts e2e/mesh-join-browser.e2e.ts e2e/keystroke-latency-relay.e2e.ts e2e/predictive-echo-relay.e2e.ts e2e/terminal-resume-relay.e2e.ts e2e/relay-two-devices.e2e.ts --workers=1
        working-directory: apps/web
        env:
          CI: "1"
          DORIFACE_RELAY_DIR: ${{ github.workspace }}/.relay
      - if: always() && env.RELAY_TOKEN_SET == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-web-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/relay-suites.xml
          if-no-files-found: ignore

  web-e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    # Each long step has its own bound, and the job's budget covers all of them at their worst, so a slow test times out
    # by itself and the report upload still runs (#2382: the old 30-minute cap cancelled runs mid-upload, leaving no log).
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: |
          echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "distro=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('bun.lock') }}
      # The .deb files of the system packages Chromium is missing on the image (doriterm#1012); the install step decides
      # whether they are enough, so this only restores them.
      - name: Restore the Playwright system packages
        id: playwright-apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          # One key per run: a set saved after an archive update can never overwrite an older one, so the newest wins by prefix.
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.distro }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('.github/scripts/playwright-linux-deps.sh') }}-${{ github.run_id }}
          restore-keys: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.distro }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('.github/scripts/playwright-linux-deps.sh') }}-
      - name: Install Chromium
        id: chromium
        working-directory: apps/web
        timeout-minutes: 12
        run: |
          # The browser binary and the system packages are cached separately. playwright-linux-deps.sh installs the
          # packages from their cache only when Playwright's own check finds its whole list installed, and from the apt
          # mirror otherwise: doriterm#1012, a mirror at ~38 kB/s ran the every-run download past its limit, and
          # doriterm#915, skipping the packages instead cost the Korean width assertions their fonts. The installs are
          # bounded by timeout, and the step by timeout-minutes (doriterm#914).
          bash "$GITHUB_WORKSPACE/.github/scripts/playwright-linux-deps.sh" "$HOME/.cache/playwright-apt"
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" >/dev/null; then
            echo "browser cache hit: installing the engine without downloading it again"
            timeout 300 bunx playwright install chromium
          else
            timeout 600 bunx playwright install chromium
          fi
      - name: Save the Playwright system packages
        if: steps.chromium.outputs.save-debs == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}
      # The e2e workers follow the runner's cores (playwright.config.ts, #342): record what this runner has.
      - name: Runner resources
        run: |
          echo "cores: $(nproc)"
          free -m
      - name: Playwright e2e against a real hc
        # Measured 21.7-27.3 min in passing runs, and cut at 28.9 and 29.4 min by the old job cap (#2382).
        timeout-minutes: 40
        run: bun run test:e2e
        working-directory: apps/web
        env:
          CI: "1"
      - name: Two e2e runs at once, each on its own ports (#37)
        timeout-minutes: 5
        run: bun run test:e2e:two-runs
        working-directory: apps/web
        env:
          CI: "1"
      - if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  android:
    # After the merge, like the other platform jobs: the Android app (#704) builds from the web build, and its JVM tests
    # open the host's own push bodies (RFC 8291) with the app's decrypting code.
    name: Android
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - name: Build the web app and copy it into the Android project
        run: bun run --cwd apps/mobile sync:android
      - name: Debug APK and JVM tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

  ios:
    # After the merge, like the other platform jobs: the iOS app (#704) and its Notification Service Extension build for
    # the simulator, unsigned.
    name: iOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Build the web app and copy it into the iOS project
        run: bun run --cwd apps/mobile sync:ios
      - name: Simulator build of the app and its extension
        working-directory: apps/mobile/ios/App
        run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  desktop:
    # After the merge, not on the pull request: nothing here can hold a pull request before it lands.
    name: Desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.20/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: ac6b86890c451a37584620aaa438b71bc0d0bd430a2e7c1d7e095f052c414e74
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      # Ubuntu's AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs; the app keeps its sandbox on.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Package (electron-builder --dir)
        working-directory: apps/desktop
        run: bun run pack
      # Installing and packing must not rewrite tracked files: a declared bin that is not committed executable gets chmodded.
      - name: The tree is clean after install and pack
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat --summary
            git --no-pager diff
            exit 1
          fi
      - name: Launch the packaged app
        working-directory: apps/desktop
        env:
          DORIFACE_E2E_EXECUTABLE: ${{ github.workspace }}/apps/desktop/dist/release/linux-unpacked/Doriterm
          # Electron's own stdout/stderr, so a launch that never connects says why.
          DEBUG: pw:browser
        run: xvfb-run --auto-servernum bun run test:e2e

  desktop-macos:
    # The desktop app ships for macOS first (signed and notarized dmg and zip), and part of its suite only runs there:
    # the hidden-inset titlebar spec and the app-menu spec skip on every other platform, and the shortcut, split-focus
    # and pairing-link specs take their Command branch only on a Mac (#609). Like the other platform jobs it runs after
    # the merge, on the push to dev, and never on a pull request.
    name: Desktop (macOS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A macOS runner bills ten times a Linux one, so the suite only runs when the change can reach the app: the shell
      # itself, the web client and host binary it packages, and the workspaces under them.
      - name: Decide whether this change reaches the desktop app
        id: scope
        run: |
          set -u
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
          else
            base="${{ github.event.before }}"
          fi
          match=true
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] &&
            git fetch --no-tags --depth=1 origin "$base" > /dev/null 2>&1; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf '%s\n' "$changed"
            match=false
            if printf '%s\n' "$changed" |
              grep -Eq '^(apps/desktop|apps/web|apps/host|packages|patches)/|^(bun\.lock|package\.json|tsconfig\.base\.json|\.github/workflows/ci\.yml)$'; then
              match=true
            fi
          else
            echo "no readable base commit: running the suite"
          fi
          echo "match=$match" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.match == 'true'
        with:
          bun-version: 1.4.4
      # bun's install cache and Electron's own downloads; the packed app itself is rebuilt every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.scope.outputs.match == 'true'
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: macos-${{ runner.arch }}-
      - name: Install herdr-core
        if: steps.scope.outputs.match == 'true'
        env:
          HC_SHA256_AARCH64: e58985d3fef6e909f33d3c5a4426e4898c81564a557d4636591cec9e3a06af26
          HC_SHA256_X86_64: 36c0331c3ffea0ffaada195b89a3c7496f7f3fc5bf35e4605c19c84e5c205a56
        run: |
          case "${{ runner.arch }}" in
            X64) arch=x86_64; sha="$HC_SHA256_X86_64" ;;
            *) arch=aarch64; sha="$HC_SHA256_AARCH64" ;;
          esac
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "https://releases.herdr.dev/core/0.1.20/herdr-core-macos-$arch.tar.gz" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$sha  $RUNNER_TEMP/hc.tar.gz" | shasum -a 256 --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - name: Install dependencies
        if: steps.scope.outputs.match == 'true'
        run: bun install --frozen-lockfile
      - name: Desktop units
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        run: bun test
      - name: Package (electron-builder --dir)
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        run: bun run pack
      # The dictation addon (apps/desktop/native, #726) was just built by pack: it is universal and loads without a prompt.
      # The slice check is scripts/universal-addon.ts, whose test runs on every pull request (#1116).
      - name: Dictation addon
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        run: |
          bun scripts/universal-addon.ts dist/native/speech.node
          bun scripts/speech-smoke.ts
      # Installing and packing must not rewrite tracked files (the same check the Linux Desktop job makes).
      - name: The tree is clean after install and pack
        if: steps.scope.outputs.match == 'true'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat --summary
            git --no-pager diff
            exit 1
          fi
      # CI points the specs at electron-builder --dir output so the app that launches is the packaged one, as on Linux.
      - name: Find the packaged app
        if: steps.scope.outputs.match == 'true'
        run: |
          app="$(find apps/desktop/dist/release -maxdepth 2 -name Doriterm.app -print -quit)"
          test -n "$app"
          echo "DORIFACE_E2E_EXECUTABLE=$PWD/$app/Contents/MacOS/Doriterm" >> "$GITHUB_ENV"
      - name: Launch the packaged app
        if: steps.scope.outputs.match == 'true'
        working-directory: apps/desktop
        env:
          CI: "1"
          # Electron's own stdout/stderr, so a launch that never connects says why.
          DEBUG: pw:browser
        run: bun run test:e2e
      - if: always() && steps.scope.outputs.match == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-e2e
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore

  windows-private-state:
    # Host key custody on Windows (#406): ACLs, not POSIX mode bits. Both supported Windows architectures run the
    # real-ACL suite and the compiled host, so bun:ffi is proven in the packaged binary too.
    name: Windows private state (${{ matrix.arch }})
    # After the merge, not on the pull request, like the rest of the platform jobs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: win-x64 }
          - { arch: arm64, runner: windows-11-arm, target: win-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Real-ACL suite (every case must run; a skip fails the job)
        shell: bash
        run: |
          bun test apps/host/src/state/win32 2>&1 | tee win32.log
          grep -E '^ +0 fail' win32.log
          if grep -qE '^ +[1-9][0-9]* skip' win32.log; then
            echo "a case was skipped"
            exit 1
          fi
          grep -E '^\(pass\) .*W[0-9]+ ' win32.log
      - name: The state units on Windows
        run: bun test apps/host/src/state/host-keys.test.ts apps/host/src/state/known-hosts.test.ts
      - name: Compiled host keeps its keys across two starts
        shell: bash
        run: |
          bun run --cwd apps/desktop build:host ${{ matrix.target }}
          host="apps/desktop/dist/host/${{ matrix.target }}/doriface-host.exe"
          state="$USERPROFILE/.doriterm-406-state"  # under the profile: $RUNNER_TEMP sits on runner paths other accounts may re-permission, which the namespace rule refuses
          first=$("$host" fingerprint --state-dir "$state")
          second=$("$host" fingerprint --state-dir "$state")
          echo "$first"
          test -n "$first" && test "$first" = "$second"

  ghostty-wasm:
    name: Ghostty wasm provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Verify the committed wasm against wasm/build.json
        run: bun packages/ghostty-wasm/scripts/verify.ts

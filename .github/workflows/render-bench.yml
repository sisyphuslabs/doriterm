name: Render bench

# #670: the web client's terminal rendering at 1, 15 and 50 live panes (apps/web/bench, docs/render-bench.md), the
# candidate against a baseline build on the same runner, round by round. The release workflow calls it before the draft
# release is made, so a regression past apps/web/bench/thresholds.json stops the release; its table and runs are
# attached to the release. Run it by hand (Actions > Render bench), or push a bench/** branch to bench that branch
# against the last published release; a branch ending in -noise benches the branch against itself, which is how the
# noise floor in the thresholds file is measured.
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
    inputs:
      baseline:
        description: Tag to compare with (default the last published release); "self" benches the candidate against itself
        required: false
        type: string
      rounds:
        description: Rounds (each runs every build once)
        default: "5"
        type: string
  workflow_call:
    inputs:
      label:
        description: The candidate's version, for the artifact's file names
        required: true
        type: string
      rounds:
        default: "5"
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bench:
    name: Render bench (1, 15, 50 panes)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      ROUNDS: ${{ inputs.rounds || '5' }}
      LABEL: ${{ inputs.label || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline is built from its tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check the round count
        run: |
          if ! [[ "$ROUNDS" =~ ^[0-9]+$ ]] || [ "$ROUNDS" -lt 1 ] || [ "$ROUNDS" -gt 20 ]; then
            echo "::error::rounds must be 1 to 20, got '$ROUNDS'"
            exit 1
          fi
      - name: Install herdr-core
        env:
          HC_URL: https://releases.herdr.dev/core/0.1.21/herdr-core-linux-x86_64.tar.gz
          HC_SHA256: 78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1
        run: |
          mkdir -p "$RUNNER_TEMP/hc"
          curl -fsSL "$HC_URL" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP/hc" herdr-core
          ln -s herdr-core "$RUNNER_TEMP/hc/hc"
          echo "$RUNNER_TEMP/hc" >> "$GITHUB_PATH"
          echo "HC_BIN=$RUNNER_TEMP/hc/hc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/hc/hc" --version
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        working-directory: apps/web
        timeout-minutes: 12
        run: |
          # This job had no browser cache, so its warm branch could never hit and every run paid a full download.
          # It has one now; the system packages are still ensured every run, because they are not in that cache.
          # apt-bounds.sh bounds every apt request install-deps makes; the rest is bounded by timeout and by the step's
          # timeout-minutes (doriterm#914).
          bash "$GITHUB_WORKSPACE/.github/scripts/apt-bounds.sh"
          timeout 300 bunx playwright install-deps chromium
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" >/dev/null; then
            timeout 300 bunx playwright install chromium
          else
            timeout 600 bunx playwright install chromium
          fi
      - name: Pick the baseline
        env:
          REQUESTED: ${{ inputs.baseline }}
          REF: ${{ github.ref_name }}
        run: |
          baseline="$REQUESTED"
          if [ -z "$baseline" ] && [[ "$REF" == *-noise ]]; then baseline=self; fi
          # The last published release: a draft (the release being made) and a prerelease are never the baseline.
          if [ -z "$baseline" ]; then baseline=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); fi
          if [ "$baseline" != self ] && ! git rev-parse --verify --quiet "refs/tags/$baseline" > /dev/null; then
            echo "::error::no tag $baseline to build the baseline from"
            exit 1
          fi
          echo "BASELINE=$baseline" >> "$GITHUB_ENV"
          echo "baseline: $baseline"
      - name: Build the candidate's web app
        working-directory: apps/web
        run: bunx --bun vite build --outDir "$RUNNER_TEMP/web-candidate" --emptyOutDir
      - name: Build the baseline's web app from its tag
        if: env.BASELINE != 'self'
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline-src" "refs/tags/$BASELINE"
          cd "$RUNNER_TEMP/baseline-src"
          bun install --frozen-lockfile
          cd apps/web
          bunx --bun vite build --outDir "$RUNNER_TEMP/web-baseline" --emptyOutDir
      # The candidate's bench drives both builds: the same spec, host and core, so only the web app differs.
      - name: Bench, round by round
        working-directory: apps/web
        env:
          CI: "1"
        run: |
          echo "cores: $(nproc)"
          free -m
          if [ "$BASELINE" = self ]; then
            builds=(--build "self-a=$RUNNER_TEMP/web-candidate" --build "self-b=$RUNNER_TEMP/web-candidate" --compare self-a)
          else
            builds=(--build "$BASELINE=$RUNNER_TEMP/web-baseline" --build "candidate=$RUNNER_TEMP/web-candidate" --compare "$BASELINE")
          fi
          bun run bench:render -- --rounds "$ROUNDS" --out "$RUNNER_TEMP/bench" "${builds[@]}"
      - name: Name the results for the release
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          safe=$(printf '%s' "$LABEL" | tr -c 'A-Za-z0-9._-' '-')
          for ext in json md; do
            [ -f "$RUNNER_TEMP/bench/render-bench.$ext" ] && cp "$RUNNER_TEMP/bench/render-bench.$ext" "$RUNNER_TEMP/results/Doriterm-$safe-render-bench.$ext"
          done
          ls -la "$RUNNER_TEMP/results"
      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Render bench: $LABEL against ${BASELINE:-no baseline}, $ROUNDS rounds"
            echo
            echo "Runner: $(nproc) cores, $(free -m | awk '/Mem:/ {print $2}') MiB"
            echo
            cat "$RUNNER_TEMP/bench/render-bench.md" 2>/dev/null || echo "no results"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-bench
          path: ${{ runner.temp }}/results/*
          if-no-files-found: warn
          retention-days: 90
